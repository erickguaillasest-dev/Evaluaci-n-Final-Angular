<div class="container card p-4 shadow-sm">
  <h2 class="mb-4">Registro de Departamentos</h2>
  <form [formGroup]="depaForm" (ngSubmit)="guardarDepartamento()">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Número de Departamento</label>
        <input type="text" class="form-control" formControlName="numeroDepartamento" placeholder="Ej: K2-E384">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" formControlName="descripcionDepartamento" placeholder="Ej: Piso 2 - Lado Este">
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Registrar Departamento</button>
  </form>
</div>

<div class="container card p-4 shadow-sm mt-4">
  <h4 class="mb-3">Departamentos Registrados</h4>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Número Departamento</th>
          <th>Descripción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of departamentos">
          <td>{{ d.numeroDepartamento }}</td>
          <td>{{ d.descripcionDepartamento }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
