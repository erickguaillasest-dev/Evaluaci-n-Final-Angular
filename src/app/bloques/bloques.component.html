<div class="container card p-4 shadow-sm">
  <h2 class="mb-4">Registro de Bloques</h2>
  <form [formGroup]="bloqueForm" (ngSubmit)="guardarBloque()">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Número de Bloque</label>
        <input type="text" class="form-control" formControlName="numeroBloque" placeholder="Ej: Bloque K">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" formControlName="descripcionBloque" placeholder="Ej: Edificio Principal">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Ubicación</label>
        <input type="text" class="form-control" formControlName="ubicacion" placeholder="Ej: Sector Norte">
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Registrar Bloque</button>
  </form>
</div>

<div class="container card p-4 shadow-sm mt-4">
  <h4 class="mb-3">Bloques Registrados</h4>
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Número Bloque</th>
          <th>Descripción</th>
          <th>Ubicación</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of bloques">
          <td>{{ b.numeroBloque }}</td>
          <td>{{ b.descripcionBloque }}</td>
          <td>{{ b.ubicacion }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
